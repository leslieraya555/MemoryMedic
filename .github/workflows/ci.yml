# File: .github/workflows/ci.yml
# Project: MemoryMedic
# Author: Leslie Raya
#
# Description:
# Builds and tests the C++ components, runs the Python regression tests,
# checks Python syntax and imports, and validates the shell scripts.
# Runs on pushes to main/master, pull requests, or a manual workflow start.

name: MemoryMedic CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

  # Allow the workflow to be started from the GitHub Actions page.
  workflow_dispatch:

# The workflow only needs permission to read the repository.
permissions:
  contents: read

# Cancel an older run for the same workflow and Git reference.
concurrency:
  group: memorymedic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-build-and-test:
    name: C++ Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Display tool versions
        run: |
          cmake --version
          c++ --version

      # Configure the C++ build with automated testing enabled.
      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build MemoryMedic
        run: |
          cmake \
            --build build \
            --config Release \
            --parallel 2

      - name: Run C++ tests
        run: |
          ctest \
            --test-dir build \
            --build-config Release \
            --output-on-failure

      - name: Verify executable
        run: |
          test -x build/memorymedic
          ./build/memorymedic --help

  python-validation:
    name: Python Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Use a consistent Python version and cache pip downloads.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml/requirements.txt

      # Require the test file and run the regression suite.
      # unittest is included with Python; pytest is not required.
      - name: Run Python regression tests
        run: |
          test -s ml/tests/test_ml_pipeline.py
          python -m unittest discover -s ml/tests -p 'test_*.py' -v

      # Catch invalid bundled examples with the same strict ML input checks.
      - name: Validate bundled telemetry examples
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json
          import sys

          sys.path.insert(0, "ml")
          from feature_engineering import add_features
          from train_model import read_csv_strict

          examples = {
              "normal_demo.csv": "normal",
              "burst_demo.csv": "normal",
              "linear_leak_demo.csv": "leak",
          }
          for name, label in examples.items():
              path = Path("data") / name
              frame = read_csv_strict(path)
              if "run_id" not in frame:
                  frame["run_id"] = path.stem
              if "label" not in frame or not frame["label"].eq(label).all():
                  raise SystemExit(f"Unexpected label in {path}")
              validated = add_features(frame)
              if validated["run_id"].nunique() != 1:
                  raise SystemExit(f"Expected one run in {path}")
              print(f"PASS: {path} ({len(validated)} rows)")

          path = Path("data/linear_leak_demo.csv")
          record = json.loads(Path("data/example_provenance.json").read_text())
          raw = read_csv_strict(path)
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if digest != record["sha256"] or len(raw) != record["rows"]:
              raise SystemExit("Replacement example differs from its collection record.")
          if not raw["run_id"].eq(record["run_id"]).all():
              raise SystemExit("Replacement example run ID differs from its record.")
          print("PASS: replacement example collection record")
          PYTHON

      # Check the ML scripts and the regression test file for syntax errors.
      - name: Check Python syntax
        run: |
          python -m py_compile \
            ml/feature_engineering.py \
            ml/train_model.py \
            ml/predict_csv.py \
            ml/tests/test_ml_pipeline.py

      - name: Test Python imports
        run: |
          python - <<'PYTHON'
          import sys

          sys.path.insert(0, "ml")

          import feature_engineering
          import train_model
          import predict_csv

          print("MemoryMedic Python modules imported successfully.")
          print(
              "Model feature count:",
              len(feature_engineering.MODEL_FEATURES),
          )
          PYTHON

  shell-script-validation:
    name: Shell Script Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Validate syntax without running workloads or collecting data.
      - name: Check dataset collection script
        run: |
          bash -n scripts/collect_dataset.sh

      - name: Check demonstration script
        run: |
          bash -n scripts/run_demo.sh

      - name: Check fresh-copy verification script
        run: |
          bash -n scripts/verify_fresh_copy.sh

